<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vector Field — A008</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050615; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .hud { position: fixed; top: 22px; left: 24px; color: #dce7ff; pointer-events: none; text-shadow: 0 0 14px #657cff; }
    h1 { margin: 0 0 5px; font-size: clamp(18px, 3vw, 30px); letter-spacing: .16em; font-weight: 500; }
    p { margin: 0; opacity: .7; font-size: 12px; letter-spacing: .08em; }
    .hint { position: fixed; right: 22px; bottom: 18px; color: #aeb9df; opacity: .65; font-size: 11px; letter-spacing: .08em; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="hud"><h1>VECTOR FIELD</h1><p>MOVE THE CURSOR · CLICK TO PULSE</p></div>
  <div class="hint">PARTICLE FLOW / 04</div>
  <script>
    const canvas = document.querySelector('#canvas');
    const context = canvas.getContext('2d');
    const pointer = { x: 0, y: 0, active: false, pulse: 0 };
    let width = 0, height = 0, particles = [];

    function resize() {
      const ratio = Math.min(devicePixelRatio || 1, 2);
      width = innerWidth; height = innerHeight;
      canvas.width = width * ratio; canvas.height = height * ratio;
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      pointer.x = width / 2; pointer.y = height / 2;
      particles = Array.from({ length: Math.min(1500, Math.floor(width * height / 850)) }, () => makeParticle(true));
    }
    function makeParticle(random = false) {
      return { x: random ? Math.random() * width : width / 2, y: random ? Math.random() * height : height / 2, px: 0, py: 0, life: Math.random() * 100, speed: .5 + Math.random() * 1.4, hue: 190 + Math.random() * 100 };
    }
    function move(event) { pointer.x = event.clientX; pointer.y = event.clientY; pointer.active = true; }
    addEventListener('resize', resize);
    addEventListener('pointermove', move);
    addEventListener('pointerleave', () => pointer.active = false);
    addEventListener('pointerdown', () => pointer.pulse = 1);

    function frame(time) {
      context.fillStyle = 'rgba(5, 6, 21, .13)';
      context.fillRect(0, 0, width, height);
      const centerX = width / 2, centerY = height / 2;
      pointer.pulse *= .94;
      for (const particle of particles) {
        particle.px = particle.x; particle.py = particle.y;
        const dx = particle.x - centerX, dy = particle.y - centerY;
        const radius = Math.max(40, Math.hypot(dx, dy));
        const swirl = .018 + 130 / radius;
        const cursorX = pointer.x - particle.x, cursorY = pointer.y - particle.y;
        const cursorDistance = Math.max(45, Math.hypot(cursorX, cursorY));
        const cursorForce = pointer.active ? Math.min(1.8, 3800 / (cursorDistance * cursorDistance)) : 0;
        const pulseForce = pointer.pulse * 8 / cursorDistance;
        particle.x += (-dy / radius * swirl + cursorX / cursorDistance * cursorForce + dx / radius * pulseForce) * particle.speed;
        particle.y += ( dx / radius * swirl + cursorY / cursorDistance * cursorForce + dy / radius * pulseForce) * particle.speed;
        particle.life -= .55;
        if (particle.life < 0 || particle.x < -30 || particle.x > width + 30 || particle.y < -30 || particle.y > height + 30) Object.assign(particle, makeParticle());
        const alpha = Math.min(.8, particle.life / 20);
        context.beginPath();
        context.moveTo(particle.px, particle.py);
        context.lineTo(particle.x, particle.y);
        context.strokeStyle = `hsla(${particle.hue + Math.sin(time / 1800) * 35}, 90%, 68%, ${alpha})`;
        context.lineWidth = .55 + alpha * 1.4;
        context.stroke();
      }
      requestAnimationFrame(frame);
    }
    resize(); requestAnimationFrame(frame);
  </script>
</body>
</html>
