name: A008 Pocket Android debug APK

on:
  push:
    branches: [experimental/a008-pocket-android]
    paths:
      - "apps/pocket/**"
      - "packages/client/**"
      - "packages/protocol/**"
      - ".github/workflows/pocket-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest already provides Android SDK; setup-android@v3 attempts to install removed 'tools'.
      - name: Build A008 SDK
        run: |
          npm ci --no-audit --no-fund
          npm run build:client
      - name: Install and typecheck Pocket
        working-directory: apps/pocket
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Generate native Android project
        working-directory: apps/pocket
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build debug APK
        working-directory: apps/pocket/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a008-pocket-debug-apk
          path: apps/pocket/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
