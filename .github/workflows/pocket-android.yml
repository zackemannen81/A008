name: A008 Pocket Android standalone APK

on:
  push:
    branches: [experimental/a008-pocket-android]
    paths:
      - "apps/pocket/**"
      - "packages/client/**"
      - "packages/protocol/**"
      - ".github/workflows/pocket-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest already provides Android SDK; setup-android@v3 attempts to install removed 'tools'.
      - name: Build A008 SDK
        run: |
          npm ci --no-audit --no-fund
          npm run build:client
      - name: Install and typecheck Pocket
        working-directory: apps/pocket
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Generate native Android project
        working-directory: apps/pocket
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone preview APK with embedded JS
        working-directory: apps/pocket/android
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify embedded JavaScript bundle
        run: |
          python3 - <<'PY'
          import zipfile
          apk = 'apps/pocket/android/app/build/outputs/apk/release/app-release.apk'
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              bundles = [n for n in names if n.endswith('index.android.bundle')]
              assert bundles, 'No embedded index.android.bundle; APK would require Metro'
              print('Standalone JS bundle verified:', bundles)
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a008-pocket-standalone-apk
          path: apps/pocket/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
